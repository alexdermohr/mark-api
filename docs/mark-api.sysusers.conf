# Root-managed non-login identities; do not reuse for general browser sessions.
# UID50046 exclusively owns SQLite main/WAL/SHM; UID50044 owns browser and
# separately stored temporary media. Existing volumes must never be reowned
# without explicit offline historical-writer and generation-aware cutover.
u mark-api 50042 "Isolated Mark dashboard frontend" /nonexistent /usr/sbin/nologin
u mark-api-witness 50043 "Independent Mark recovery witness" /var/lib/mark-fence /usr/sbin/nologin
u mark-api-owner 50044 "Mark browser/write executor without raw SQLite" /var/lib/mark-api-media /usr/sbin/nologin
u mark-api-ingress 50045 "Loopback-only HTTP to netless frontend" /nonexistent /usr/sbin/nologin
u mark-api-storage 50046 "Independent Mark SQLite owner" /var/lib/mark-api /usr/sbin/nologin
