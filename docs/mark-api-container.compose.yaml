# Draft only: the attested operator control still denies live installation
# until real multi-UID CDP, SQLite, Witness and backup/restore gates pass.
# Each external volume must be provisioned and independently attested offline.
services:
  mark-api:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["live"]
    # Untrusted HTTP-only frontend; no browser, SQLite, or witness authority.
    user: "50042:50042"
    working_dir: /
    entrypoint: ["/bin/sh", "/etc/mark-api/frontend.sh"]
    # Kernel-enforced independent boundary: even malicious UID 50042 code
    # has no route to host CDP, owner ports, IPv6, gateways or LAN.
    network_mode: none
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-I", "-S", "/etc/mark-api/healthcheck.py", "frontend"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    depends_on:
      mark-api-owner:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    restart: "no"
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432,mode=1777
    volumes:
      - type: volume
        source: mark_executor_socket
        target: /run/mark-api-executor
        volume:
          nocopy: true
        read_only: true
      - type: volume
        source: mark_ingress_socket
        target: /run/mark-api-ingress
        volume:
          nocopy: true
  # Trusted fixed-destination byte ingress only. UID 50045 receives no
  # executor, witness, SQLite, backup or browser mounts. Only the frontend
  # can accept its SO_PEERCRED-attested Unix socket connection.
  mark-api-ingress:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["live"]
    user: "50045:50045"
    entrypoint: ["/bin/sh", "/etc/mark-api/ingress.sh"]
    working_dir: /
    network_mode: host
    depends_on:
      mark-api:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    restart: "no"
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-I", "-S", "/etc/mark-api/healthcheck.py", "ingress"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16777216,mode=1777
    volumes:
      - type: volume
        source: mark_ingress_socket
        target: /run/mark-api-ingress
        volume:
          nocopy: true
        read_only: true
  mark-api-owner:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["live"]
    # Browser/CDP/write executor. No raw SQLite, WAL/SHM or backup mount.
    user: "50044:50044"
    entrypoint: ["/bin/sh", "/etc/mark-api/start.sh"]
    network_mode: host
    working_dir: /
    depends_on:
      mark-api-witness:
        condition: service_healthy
      mark-api-storage:
        condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: "no"
    stop_grace_period: 60s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777
      - /run/mark-api:rw,nosuid,nodev,noexec,size=1048576,uid=50044,gid=50044,mode=0700
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-I", "-S", "/etc/mark-api/healthcheck.py", "owner"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    volumes:
      - type: volume
        source: mark_media
        target: /var/lib/mark-api-media
        volume:
          nocopy: true
      - type: volume
        source: mark_storage_socket
        target: /run/mark-api-storage
        volume:
          nocopy: true
        read_only: true
      - type: volume
        source: mark_fence_runtime_socket
        target: /run/mark-api-witness
        volume:
          nocopy: true
        read_only: true
      - type: volume
        source: mark_executor_socket
        target: /run/mark-api-executor
        volume:
          nocopy: true
  mark-api-witness:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["live"]
    user: "50043:50043"
    network_mode: none
    working_dir: /
    entrypoint: ["/bin/sh", "/etc/mark-api/witness.sh"]
    command: ["--ledger", "/var/lib/mark-fence/ledger.sqlite",
              "--runtime-socket", "/run/mark-api-witness/runtime.sock",
              "--operator-socket", "/run/mark-fence-operator/operator.sock",
              "--runtime-uid", "50044", "--runtime-gid", "50044",
              "--operator-uid", "0"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    restart: "no"
    stop_grace_period: 90s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16777216,mode=1777
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-I", "-S", "/etc/mark-api/healthcheck.py", "witness"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    volumes:
      - type: volume
        source: mark_fence_ledger
        target: /var/lib/mark-fence
        volume:
          nocopy: true
      - type: volume
        source: mark_fence_runtime_socket
        target: /run/mark-api-witness
        volume:
          nocopy: true
      - type: volume
        source: mark_fence_operator_socket
        target: /run/mark-fence-operator
        volume:
          nocopy: true
  mark-api-backup:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["backup"]
    # Until paired SQLite/Witness backup exists, this is still hard-stopped.
    # Never run backup as the compromised browser/CDP executor UID.
    user: "50046:50046"
    working_dir: /
    network_mode: none
    entrypoint: ["/bin/sh", "/etc/mark-api/backup.sh"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: "no"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=134217728,mode=1777
    volumes:
      - type: volume
        source: mark_data
        target: /var/lib/mark-api
        volume:
          nocopy: true
      - type: volume
        source: mark_backups
        target: /var/lib/mark-api-backups
        volume:
          nocopy: true

  mark-api-storage:
    image: sha256:${MARK_API_IMAGE_DIGEST:?Verified immutable image digest required}
    profiles: ["live"]
    # Dedicated SQLite main/WAL/SHM authority; no browser/CDP or public HTTP.
    user: "50046:50046"
    entrypoint: ["/bin/sh", "/etc/mark-api/storage.sh"]
    command: []
    network_mode: none
    working_dir: /
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    restart: "no"
    stop_grace_period: 90s
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=33554432,mode=1777
    healthcheck:
      test: ["CMD", "/usr/bin/python3", "-I", "-S", "/etc/mark-api/healthcheck.py", "storage"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 2s
    volumes:
      - type: volume
        source: mark_data
        target: /var/lib/mark-api
        volume:
          nocopy: true
      - type: volume
        source: mark_storage_socket
        target: /run/mark-api-storage
        volume:
          nocopy: true

# Never automatically create or re-own existing user-data volumes.
volumes:
  mark_data:
    external: true
    name: mark-api-data-v1
  mark_media:
    external: true
    name: mark-api-media-v1
  mark_storage_socket:
    external: true
    name: mark-api-storage-socket-v1
  mark_backups:
    external: true
    name: mark-api-backups-v1
  mark_fence_ledger:
    external: true
    name: mark-api-fence-ledger-v1
  mark_fence_runtime_socket:
    external: true
    name: mark-api-fence-runtime-socket-v1
  mark_fence_operator_socket:
    external: true
    name: mark-api-fence-operator-socket-v1
  mark_executor_socket:
    external: true
    name: mark-api-executor-socket-v1
  mark_ingress_socket:
    external: true
    name: mark-api-ingress-socket-v1
