[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeiger"
version = "0.1.0"
description = "Kleinanzeiger: Anzeigenverwaltung, Synchronisation, Auswertung und KI-Unterstützung"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
private-web = ["websocket-client>=1.8,<2", "Pillow>=10.4,<13"]
generation = ["openai>=2.11,<3"]

[project.scripts]
kleinanzeiger = "mark_api.launcher:main"
kleinanzeiger-dashboard = "mark_api.dashboard:main"
kleinanzeiger-protected-frontend = "mark_api.protected_frontend:main"
kleinanzeiger-protected-owner = "mark_api.protected_owner:main"
kleinanzeiger-protected-actor = "mark_api.protected_actor:main"
kleinanzeiger-protected-witness = "mark_api.protected_witness:main"
kleinanzeiger-protected = "mark_api.protected_product:main"
kleinanzeiger-offline = "mark_api.offline_launcher:main"
kleinanzeiger-generate = "mark_api.generation_cli:main"
kleinanzeiger-backup = "mark_api.backup_cli:main"
kleinanzeiger-sync = "mark_api.periodic_sync:main"
kleinanzeiger-import-mail = "mark_api.email_import_cli:main"
kleinanzeiger-local-smoke = "mark_api.local_smoke:main"
kleinanzeiger-classify = "mark_api.classification_cli:main"
kleinanzeiger-migrate-legacy = "mark_api.legacy_migration:main"
mark-api-dashboard = "mark_api.dashboard:main"
mark-api-offline = "mark_api.offline_launcher:main"
mark-api-classify = "mark_api.classification_cli:main"
mark-api-import-mail = "mark_api.email_import_cli:main"
mark-api-local-smoke = "mark_api.local_smoke:main"
mark-api-launch = "mark_api.launcher:main"
mark-api-inventory-sync = "mark_api.owner_inventory_cli:main"
mark-api-migrate-legacy = "mark_api.legacy_migration:main"
mark-api-generate = "mark_api.generation_cli:main"
mark-api-backup = "mark_api.backup_cli:main"
mark-api-sync = "mark_api.periodic_sync:main"
mark-api-pair-restore-check = "mark_api.paired_restore_preflight:main"
kleinanzeiger-pair-restore-check = "mark_api.paired_restore_preflight:main"

[tool.setuptools.packages.find]
where = ["src"]