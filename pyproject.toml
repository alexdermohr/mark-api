[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-api"
version = "0.1.0"
description = "Thin Kleinanzeigen orchestration core for Mark"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mark-api-dashboard = "mark_api.dashboard:main"
mark-api-classify = "mark_api.classification_cli:main"
mark-api-import-mail = "mark_api.email_import_cli:main"
mark-api-local-smoke = "mark_api.local_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]
