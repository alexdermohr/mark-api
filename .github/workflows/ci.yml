---
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Show runtimes
        run: |
          python --version
          node --version

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in src tests tools; do
            if [[ -d "$path" ]]; then
              paths+=("$path")
            fi
          done
          if [[ ${#paths[@]} -gt 0 ]]; then
            python -m compileall -q "${paths[@]}"
          fi

      - name: Run unit tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -v
          fi

      - name: Check embedded dashboard JavaScript
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [[ -f src/mark_api/dashboard.py ]]; then
            python -c 'from mark_api.dashboard import _DASHBOARD_JS; print(_DASHBOARD_JS)' | node --check -
          fi

      - name: Determine diff base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] \
            && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE_SHA"
          else
            base="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$base^{commit}"
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Scan commit-added lines for secret patterns
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="${PR_HEAD_SHA:-$EVENT_SHA}"
          python tools/ci_secret_scan.py "$BASE_SHA" "$head"
