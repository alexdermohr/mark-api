---
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: "3.12"
            check_name: verify
          - python_version: "3.13"
            check_name: verify-py313

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "${{ matrix.python_version }}"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: Show runtimes
        run: |
          python --version
          node --version

      - name: Compile Python
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in src tests tools; do
            if [[ -d "$path" ]]; then
              paths+=("$path")
            fi
          done
          if [[ ${#paths[@]} -gt 0 ]]; then
            python -m compileall -q "${paths[@]}"
          fi

      - name: Run unit tests
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then
            python -m unittest discover -s tests -v
          fi

      - name: Verify installed wheel and offline product path
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf "$artifact_dir"' EXIT

          python -m pip wheel --no-deps --wheel-dir "$artifact_dir/wheels" .
          python -m venv "$artifact_dir/venv"
          "$artifact_dir/venv/bin/python" -m pip install --no-deps "$artifact_dir"/wheels/kleinanzeiger-*.whl

          # Installed entrypoint must exist without private-web dependencies,
          # and must refuse an uninitialized/typo SQLite path before binding.
          offline_bin="$artifact_dir/venv/bin/mark-api-offline"
          "$offline_bin" --help > "$artifact_dir/offline-help.txt"
          grep -q -- "--email" "$artifact_dir/offline-help.txt"
          # These are real installed role entrypoints. A missing private FD
          # must deny startup without binding a browser, owner or witness.
          for role in protected-owner protected-actor protected-witness; do
            role_bin="$artifact_dir/venv/bin/kleinanzeiger-$role"
            "$role_bin" --help > /dev/null
            if "$role_bin" --config-fd=-1 > "$artifact_dir/$role-denial.txt" 2>&1; then
              echo "Untrusted $role unexpectedly admitted" >&2
              exit 1
            fi
            grep -Fq 'unavailable' "$artifact_dir/$role-denial.txt"
          done
          missing_db="$artifact_dir/not-initialized.sqlite"
          if "$offline_bin" --db "$missing_db" > "$artifact_dir/offline-denial.txt" 2>&1; then
            echo "offline launcher unexpectedly accepted a missing database" >&2
            exit 1
          fi
          test ! -e "$missing_db"

          # Synthetic local email; no live accounts or Kleinanzeigen requests.
          python - "$artifact_dir/message.eml" <<'PY'
          from email import policy
          from email.message import EmailMessage
          from pathlib import Path
          import sys

          message = EmailMessage(policy=policy.default)
          message["From"] = "Kleinanzeigen <noreply@mail.kleinanzeigen.de>"
          message["To"] = "owner@example.invalid"
          message["Date"] = "Thu, 24 Sep 2026 10:37:48 +0000"
          message["Message-ID"] = "<ci-smoke-1@chat.kleinanzeigen.de>"
          message["X-Conversation-ID"] = "ci:smoke:one"
          message["X-Message-ID"] = "ci-smoke-1"
          message.set_content(
              "Anfrage zu deiner Anzeige\n"
              "(Anzeigennummer: 1234567890)\n"
              "https://www.kleinanzeigen.de/m-nachrichten.html?"
              "conversationId=ci:smoke:one"
          )
          Path(sys.argv[1]).write_bytes(message.as_bytes(policy=policy.default))
          PY

          timeout 30s "$artifact_dir/venv/bin/mark-api-local-smoke" \
            "$artifact_dir/message.eml" > "$artifact_dir/smoke.json"
          "$artifact_dir/venv/bin/mark-api-import-mail" \
            --db "$artifact_dir/state.sqlite" --init-db \
            "$artifact_dir/message.eml" > /dev/null
          "$artifact_dir/venv/bin/mark-api-classify" \
            --db "$artifact_dir/state.sqlite" --ad-id 1234567890 \
            --city Berlin > /dev/null

          # -I prevents imports from the checkout: assert actual installed bytes.
          "$artifact_dir/venv/bin/python" -I - "$artifact_dir" <<'PY'
          import json
          from pathlib import Path
          import sys

          import mark_api
          from mark_api.analytics import AnalyticsService
          from mark_api.storage import SnapshotStore

          root = Path(sys.argv[1])
          assert "site-packages" in Path(mark_api.__file__).parts
          report = json.loads((root / "smoke.json").read_text())
          assert report["parsed_files"] == 1
          assert report["inserted_events"] == 1
          assert report["email_inbound_message_total"] == 1
          assert report["analytics_ranked_ads"] == 1
          assert report["dashboard_health_ok"] is True
          assert report["http_write_methods_rejected"] is True
          assert report["write_route_absent"] is True
          assert report["platform_writes_enabled"] is False

          store = SnapshotStore(root / "state.sqlite")
          assert store.is_ready()
          assert store.tracked_ad_ids() == ()  # Email alone is not ownership.
          groups = AnalyticsService(store).group_rankings(
              "city", "email_inbound_message_count"
          )
          assert [(g.label, g.sample_size, g.metric_sum) for g in groups] == [
              ("Berlin", 1, 1)
          ]
          PY

      - name: Check embedded dashboard JavaScript
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          if [[ -f src/mark_api/dashboard.py ]]; then
            python -c 'from mark_api.dashboard import _DASHBOARD_JS; print(_DASHBOARD_JS)' | node --check -
          fi

      - name: Determine diff base
        id: diff-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$(
            python tools/ci_secret_scan.py \
              --resolve-base \
              --event-name "$EVENT_NAME" \
              --pr-base-sha "$PR_BASE_SHA" \
              --push-before-sha "$PUSH_BEFORE_SHA" \
              --default-branch "$DEFAULT_BRANCH" \
              --event-head "$EVENT_SHA"
          )"
          git cat-file -e "$base^{commit}"
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Check diff hygiene
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="${PR_HEAD_SHA:-$EVENT_SHA}"
          git diff --check "$BASE_SHA...$head"

      - name: Scan commit-added lines for secret patterns
        env:
          BASE_SHA: ${{ steps.diff-base.outputs.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head="${PR_HEAD_SHA:-$EVENT_SHA}"
          python tools/ci_secret_scan.py "$BASE_SHA" "$head"